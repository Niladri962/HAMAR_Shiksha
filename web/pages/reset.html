<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password · HAMAR SHIKSHA</title>
<link rel="stylesheet" href="/static/css/app.css">
<script src="/static/js/theme.js"></script>
<script src="/static/js/i18n.js" defer></script>
<script src="/static/js/core.js" defer></script>
<script src="/static/js/login.js" defer></script>
</head>
<body class="theme-admin" data-portal="" data-reset="1">
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/"><span class="brand-mark" aria-hidden="true">हश</span>
      <span class="brand-name" data-i18n="app_name">HAMAR SHIKSHA</span></a>
  </div>
</header>
<div class="login-wrap">
  <section class="login-card" aria-labelledby="reset-title">
    <header><h1 id="reset-title">Reset password</h1>
      <div class="small">For administrators and teachers. Students: please ask your class teacher.</div></header>
    <form id="request-form">
      <div class="field"><label for="r-login">Login ID</label>
        <input id="r-login" name="login_id" required autocomplete="username"></div>
      <div class="form-error" id="request-msg" role="status"></div>
      <button class="primary" type="submit">Send reset link</button>
    </form>
    <form id="confirm-form" class="hidden">
      <div class="field"><label for="r-new">New password</label>
        <input id="r-new" name="new_password" type="password" required autocomplete="new-password" minlength="10"></div>
      <div class="field"><label for="r-rep">Repeat new password</label>
        <input id="r-rep" name="repeat" type="password" required autocomplete="new-password"></div>
      <div class="form-error" id="confirm-msg" role="alert"></div>
      <button class="primary" type="submit">Set password</button>
    </form>
    <div class="other"><a href="/">All portals</a></div>
  </section>
</div>
</body>
</html>
