<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Login · HAMAR SHIKSHA</title>
<link rel="stylesheet" href="/static/css/app.css">
<script src="/static/js/theme.js"></script>
<script src="/static/js/i18n.js" defer></script>
<script src="/static/js/core.js" defer></script>
<script src="/static/js/login.js" defer></script>
</head>
<body class="theme-student" data-portal="student" data-login="1">
<a class="skip" href="#login-form">Skip to sign in</a>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/"><span class="brand-mark" aria-hidden="true">हश</span>
      <span><span class="brand-name" data-i18n="app_name">HAMAR SHIKSHA</span></span></a>
    <span class="spacer"></span>
    <button id="btn-lang" type="button" data-i18n="language">English</button>
  </div>
</header>
<div class="login-wrap">
  <section class="login-card" aria-labelledby="login-title">
    <header>
      <div class="small">🎒 <span data-i18n="app_name">HAMAR SHIKSHA</span></div>
      <h1 id="login-title" data-i18n="student_portal">Student login</h1>
      <div class="small" data-i18n="student_portal_desc">Students enrolled in registered schools.</div>
    </header>
    <form id="login-form" novalidate>
      <div class="field">
        <label for="login_id" data-i18n="login_id">Login ID</label>
        <input id="login_id" name="login_id" autocomplete="username" required autocapitalize="off" spellcheck="false">
        <div class="hint" data-i18n="student_login_hint">The login ID given by your school</div>
      </div>
      <div class="field">
        <label for="password" data-i18n="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <div class="form-error" id="login-error" role="alert"></div>
      <button class="primary" type="submit" data-i18n="sign_in">Sign in</button>
      <p class="small muted" data-i18n="student_forgot">Forgot your password? Ask your class teacher to reset it.</p>
    </form>
    <div class="other"><a href="/" data-i18n="go_home">All portals</a></div>
  </section>
</div>
</body>
</html>
